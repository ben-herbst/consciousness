version: 1
project:
  id: 152a1471-44ab-4219-b56c-4fbbf81ef027
  author: Ben Herbst
  # title:
  # description:
  # keywords: []
  # authors: []
  # github:
  # To autogenerate a Table of Contents, run "myst init --write-toc"
  toc:
    # Auto-generated by `myst init --write-toc`
    - file: consciousness.md

  bibliography:
    - references.bib

  exports:
    - format: pdf
      template: lapreprint-typst
      output: consciousness.pdf

site:
  # Pinned to article-theme v1.4.1 rather than the bare name `article-theme`.
  #
  # The bare name resolves through api.mystmd.org to this repository's `main`
  # branch, so every build silently picks up whatever has been pushed there.
  # v2.0.0 landed on 2026-11-10 and mystmd 1.12.0 cannot prerender it: the
  # build dies on `No route matches URL "/_public/consciousness-<hash>.md"`.
  # That broke CI on content which had built successfully the day before, and
  # it broke previously-good commits too, because the content was never the
  # variable.
  #
  # mystmd 1.12.0 is the latest release, so there is no version to upgrade to.
  # The template repository publishes no git tags, hence the commit SHA.
  # Revisit once a mystmd release supports article-theme v2.
  template: https://github.com/myst-templates/article-theme/archive/4acce1eba558b301c2aadca99a7804aa6e294e1e.zip
  # options:
  #   favicon: favicon.ico
  #   logo: site_logo.png
